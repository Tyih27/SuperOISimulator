name: Release Gate

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: super_oi
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: super_oi
        options: >-
          --health-cmd "pg_isready -U super_oi -d super_oi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://super_oi:test-password@127.0.0.1:5432/super_oi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run simulate:balance
      - run: npm run test:container
